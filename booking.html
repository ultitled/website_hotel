<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Stay – King The Land Hotel</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div class="logo">King The Land Hotel</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="booking.html" class="active">Booking</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <section class="booking">
    <div class="booking-container">
      <h1>Book Your Stay</h1>
      <p>Reserve your escape to elegance. Fill out your details below — your story at King The Land begins here.</p>

      <form action="#" method="post" class="booking-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group two-columns">
          <div>
            <label for="checkin">Check-in</label>
            <input type="date" id="checkin" required />
          </div>
          <div>
            <label for="checkout">Check-out</label>
            <input type="date" id="checkout" required />
          </div>
        </div>
        <div class="form-group">
          <label for="guests">Number of Guests</label>
           <input type="number" id="guests" required />
        </div>


        <div class="form-group">
          <label for="message">Special Requests</label>
          <textarea id="message" rows="4" placeholder="Tell us anything you'd love during your stay"></textarea>
        </div>

        <button type="submit" class="btn">Confirm Booking</button>
      </form>
    </div>
  </section>

  <footer class="footer">
     &copy; 2025 King The Land Hotel
  </footer>
</body>
</html>
